# test
server:
  port: 8100
  #servlet:
  #  context-path: /api

spring:
  application:
    name: apigateway-service
#  profiles:
#    active: local
  cloud:
    loadbalancer:
      enabled: true
    gateway:
      default-filters:
        - name : GlobalFilter
          args :
            baseMessage: Spring Cloud Gateway Global Filter
            preLogger: true
            postLogger: true
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials RETAIN_UNIQUE
      routes:
        - id : mapservice-rest
          uri: lb://MAPSERVICE-REST
          predicates:
            - Path=/map/**
          filters:
            - name : CustomFilter
            - PreserveHostHeader
        - id: sj-lab-scheduler
          uri: lb://SJ-LAB-SCHEDULER
          predicates:
            - Path=/scheduler/**
          filters:
            - name: CustomFilter
            - PreserveHostHeader
        - id: fast-api-ai
          uri: lb://FAST-API-AI
          predicates:
            - Path=/fast-api-ai/**
          filters:
            - name: CustomFilter
            - PreserveHostHeader
        - id: sj-lab-authserver
          uri: lb://SJ-LAB-AUTHSERVER
          predicates:
            - Path=/auth/**
          filters:
            - name: CustomFilter
            - PreserveHostHeader
        # 공개 API(sj-lab-openapi). 정적 활용 페이지는 sj-lab.co.kr/openapi/ 에서 웹서버가 서빙하므로
        # 경로를 /openapi 가 아니라 /open-api 로 둔다(같은 도메인이 아니라 겹치진 않지만 헷갈리지 않게).
        - id: sj-lab-openapi
          uri: lb://SJ-LAB-OPENAPI
          predicates:
            - Path=/open-api/**
          filters:
            - name: CustomFilter
            - PreserveHostHeader
      globalcors:
        add-to-simple-url-handler-mapping: true   # OPTIONS 처리 보장
        corsConfigurations:
          # 공개 API 는 남의 웹사이트에서도 부를 수 있어야 하므로 오리진을 열어 둔다.
          # 아래 '[/**]' 보다 반드시 먼저 와야 한다 — UrlBasedCorsConfigurationSource 는
          # 맵을 순서대로 훑어 처음 맞는 패턴의 설정을 쓰므로, 뒤에 두면 '[/**]' 가 먼저 잡혀
          # 외부 오리진이 다시 403 이 된다.
          #
          # allowCredentials 는 반드시 false 다. 오리진이 '*' 인데 true 면 브라우저가
          # 응답을 버리고(CORS 규격), Spring 도 기동 시 예외를 낸다.
          # 공개 API 는 쿠키·인증정보를 쓰지 않고 X-API-Key 헤더만 받으므로 false 로 충분하다.
          '[/open-api/**]':
            allowedOrigins: [ "*" ]
            allowedMethods:
              - GET
              - OPTIONS
            allowedHeaders:
              - Content-Type
              - X-API-Key
            exposedHeaders:
              - Content-Length
              - Cache-Control
            allowCredentials: false
            maxAge: 3600
          '[/**]':
            allowedOrigins:
              - http://localhost:4000
              - https://sj-lab.co.kr
              - https://www.sj-lab.co.kr
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: [ "*" ]
            exposedHeaders:
              - Content-Length
              - Content-Range
              - Content-Disposition
            allowCredentials: true
            maxAge: 3600